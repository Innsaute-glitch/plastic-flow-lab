<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Plastic Flow Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B1A15'/%3E%3Cpath d='M5 14c0-4.500 3.500-8 8-8h6v5.500c0 4.500-3.500 8-8 8H5z' fill='none' stroke='%23C6F36B' stroke-width='1.800'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="layout">
        <aside id="controls" class="app-col" aria-label="Scenario controls"></aside>
        <section id="map-stage" aria-label="Map">
          <div id="map-strip"></div>
          <div id="map-wrap">
            <div id="map-frame">
              <img id="map-image" alt="Campus map" draggable="false" />
              <canvas id="map-anim-layer"></canvas>
              <svg id="map-edit-layer" xmlns="http://www.w3.org/2000/svg"></svg>
              <div id="map-scale"></div>
              <div id="map-attribution"></div>
              <div id="map-popover" hidden></div>
            </div>
          </div>
          <div id="map-foot"></div>
        </section>
        <aside id="results" aria-label="Results"></aside>
      </main>
      <div id="overlay-root"></div>
      <div id="toast-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
